services:
  postgres:
    image: postgres:16.4-alpine
    container_name: spycam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spycam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spycam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-spycam}", "-d", "${POSTGRES_DB:-spycam}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    container_name: spycam-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  suricata:
    image: spycam/suricata:0.1.0
    build:
      context: .
      dockerfile: suricata/Dockerfile
    container_name: spycam-suricata
    restart: unless-stopped
    environment:
      ENGINE_AGENT_TOKEN: ${ENGINE_AGENT_TOKEN:?set ENGINE_AGENT_TOKEN in .env}
      AGG_WINDOW_SECONDS: ${AGG_WINDOW_SECONDS:-60}
    volumes:
      - pcaps:/data/pcaps:ro
      - rules-active:/opt/spycam/rules-active:ro
      - eve-out:/var/log/suricata
    networks: [internal]

  # 在线抓包（C1）：docker compose --profile live up -d
  # 默认 host 网络监听宿主机网卡（需 Linux 宿主；Docker Desktop 只能看到其虚拟机网卡）。
  # 不发布任何端口，只写 eve-out/live/eve.json，由 worker 持续 tail 入库。
  suricata-live:
    image: spycam/suricata:0.1.0
    container_name: spycam-suricata-live
    restart: unless-stopped
    profiles: ["live"]
    entrypoint: ["/entrypoint-live.sh"]
    network_mode: ${LIVE_NETWORK_MODE:-host}
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    environment:
      LIVE_IFACE: ${LIVE_IFACE:-eth0}
      LIVE_HOME_NET: ${LIVE_HOME_NET:-}
      LIVE_EVE_MAX_MB: ${LIVE_EVE_MAX_MB:-100}
    volumes:
      - rules-active:/opt/spycam/rules-active:ro
      - eve-out:/var/log/suricata
    depends_on:
      - suricata

  api:
    image: spycam/api:0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: spycam-api
    restart: unless-stopped
    env_file: .env
    environment:
      API_LISTEN: ":8081"
      MIGRATIONS_DIR: /app/migrations
      SEED_RULES_DIR: /app/seed-rules
      RULES_ACTIVE_DIR: /rules-active
      PCAPS_DIR: /data/pcaps
      ENGINE_AGENT_URL: http://suricata:9090
    volumes:
      - pcaps:/data/pcaps
      - rules-active:/rules-active
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    image: spycam/worker:0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: spycam-worker
    restart: unless-stopped
    env_file: .env
    environment:
      MIGRATIONS_DIR: /app/migrations
      EVE_OUT_DIR: /var/log/suricata
      LIVE_IFACE: ${LIVE_IFACE:-eth0}
      ENGINE_AGENT_URL: http://suricata:9090
    volumes:
      - eve-out:/var/log/suricata:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      suricata:
        condition: service_started
    networks: [internal]

  web:
    image: spycam/web:0.1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spycam-web
    restart: unless-stopped
    ports:
      # 宿主机与容器内均不使用 80/8080 等常用端口；冲突时改 .env 的 WEB_PORT
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-28765}:28765"
    depends_on:
      - api
    networks: [internal]

  validator:
    image: spycam/validator:0.1.0
    build:
      context: ./validation
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      API_BASE_URL: http://api:8081
      VALIDATOR_USER: ${SEED_ADMIN_USER:-admin}
      VALIDATOR_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      VALIDATION_OUT: /data/out
    volumes:
      - pcaps:/data/pcaps
      - ./validation/out:/data/out
    depends_on:
      - api
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  pcaps:
  eve-out:
  rules-active:

networks:
  internal:
    driver: bridge
